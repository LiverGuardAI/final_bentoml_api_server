service: "service:LiverGuardService"

include:
  - "*.py"
  - "models/"
  - "models/artifacts/*.joblib"
  - "models/artifacts/*.json"

python:
  packages:
    - bentoml>=1.2.0
    - numpy>=1.24.0
    - pandas>=2.0.0
    - scikit-learn>=1.3.0
    - xgboost>=2.0.0
    - lifelines>=0.27.0
    - joblib>=1.3.0

docker:
  python_version: "3.10"
