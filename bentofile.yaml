# BentoML Build Configuration
# LiverGuard CDSS 
#
# 빌드: bentoml build
# 컨테이너화: bentoml containerize liverguard_cdss:latest

service: "service:svc"

labels:
  project: liverguard-cdss

include:
  - "*.py"
  - "artifacts/*.joblib"
  - "artifacts/*.json"

python:
  packages:
    - numpy>=1.21.0
    - pandas>=1.3.0
    - scikit-learn>=1.0.0
    - xgboost>=1.5.0
    - lifelines>=0.27.0
    - joblib>=1.1.0

docker:
  distro: debian
  python_version: "3.10"
  system_packages:
    - build-essential
  env:
    BENTOML_PORT: "3001"
