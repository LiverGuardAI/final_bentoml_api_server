# BentoML Build Configuration
# LiverGuard CDSS 
#
# 빌드: bentoml build
# 컨테이너화: bentoml containerize liverguard_cdss:latest

service: "service:LiverGuardService"

labels:
  project: liverguard-cdss

include:
  - "*.py"
  - "artifacts/*.joblib"
  - "artifacts/*.json"
  - "artifacts/*.csv"   # 식약처 DB 포함
  - "artifacts/*.pkl"   # 매핑 데이터 포함

python:
  packages:
    - numpy>=1.21.0
    - pandas>=1.3.0
    - scikit-learn>=1.6.1
    - xgboost>=1.5.0
    - lifelines>=0.27.0
    - joblib>=1.1.0
    - bentoml>=1.4.0
    - rdkit-pypi
    - shap

docker:
  distro: debian
  python_version: "3.10"
  system_packages:
    - build-essential
  env:
    BENTOML_PORT: "3001"
