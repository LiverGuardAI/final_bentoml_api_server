# BentoML Build Configuration
# LiverGuard CDSS 
#
# 빌드: bentoml build
# 컨테이너화: bentoml containerize liverguard_cdss:latest

service: "service:LiverGuardService"

labels:
  project: liverguard-cdss

# BentoML Model Store에서 번들링할 모델들
models:
  - liverguard_stage:latest
  - liverguard_relapse:latest
  - liverguard_survival:latest
  - ddi_v5_model:latest

include:
  - "*.py"
  - "artifacts/*.joblib"
  - "artifacts/*.json"
  - "artifacts/*.csv"   # 식약처 DB 포함
  - "artifacts/*.pkl"   # 매핑 데이터 포함
  - "requirements.txt"

python:
  requirements_txt: "./requirements.txt"
  lock_packages: false

docker:
  dockerfile_template: "./Dockerfile.template"
